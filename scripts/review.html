<!doctype html>
<meta charset="utf-8">
<title>segment review</title>
<style>
body{font:13px system-ui;background:#111;color:#ddd;margin:0;padding:0 12px 60px}
.hdr{position:sticky;top:0;background:#111;padding:8px 0;z-index:2;border-bottom:1px solid #333;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hdr input,.hdr select{background:#222;color:#ddd;border:1px solid #444;padding:4px}
.c{display:grid;grid-template-columns:270px repeat(5,1fr);gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid #2a2a2a}
.c.accept{background:#0f1f10}.c.reject{opacity:.45}
.c img.t{width:100%;display:block;cursor:pointer}
.lab{color:#888;font-size:11px}
.m{font-weight:bold}.m.bezel{color:#8f8}.m.mask{color:#6cf}.m.screen_only{color:#c9f}.m.no_yellow{color:#fc6}.m.anchor_only{color:#f66}
.strip{grid-column:1/-1}.strip img{width:100%;height:14px;image-rendering:pixelated}
.panel{grid-column:1/-1;display:none;grid-template-columns:480px 1fr;gap:12px;background:#1a1a1a;padding:10px;border-radius:6px}
.c.open .panel{display:grid}
video{width:480px;height:360px;background:#000;display:block}
.vwrap{position:relative;width:480px}
canvas.hold{position:absolute;left:0;top:0;width:480px;height:360px;display:none;outline:2px solid #fc6}
.ctl input.holds{width:430px}
.ctl button{font:13px system-ui;padding:5px 8px;margin:2px;background:#333;color:#ddd;border:1px solid #555;border-radius:4px;cursor:pointer}
.ctl button:hover{background:#444}.ctl button.on{background:#264}
.ctl .row{margin:6px 0}
.ctl input[type=text]{background:#222;color:#ddd;border:1px solid #444;padding:4px;width:110px}
.ctl input.note{width:100%}
.big{font-size:20px;font-family:ui-monospace,monospace}
kbd{background:#333;border:1px solid #555;border-radius:3px;padding:0 4px;font:11px ui-monospace,monospace}
#status{color:#8f8}
</style>
<div class=hdr>
  <b>segment review</b>
  <input id=q placeholder="filter: episode / id / text" size=28>
  <select id=fm><option value="">all methods</option><option>bezel</option><option>mask</option><option>screen_only</option><option>no_yellow</option><option>anchor_only</option></select>
  <select id=fs><option value="">all statuses</option><option value="todo">todo</option><option value="accept">accepted</option><option value="reject">rejected</option><option value="auto">auto-cut, to check</option></select>
  <span id=count></span>
  <span id=status></span>
  <span class=lab>keys when a row is open: <kbd>,</kbd><kbd>.</kbd> ±1 frame &nbsp;<kbd>←</kbd><kbd>→</kbd> ±1 s &nbsp;<kbd>shift</kbd> ±5 s &nbsp;<kbd>space</kbd> play &nbsp;<kbd>[</kbd><kbd>]</kbd> set start/end &nbsp;<kbd>{</kbd><kbd>}</kbd> hold start/end <kbd>v</kbd> hold start→here &nbsp;<kbd>(</kbd><kbd>)</kbd> cut start/end &nbsp;<kbd>k</kbd> keep cuts <kbd>u</kbd> undo cuts <kbd>r</kbd> revert to my edit &nbsp;<kbd>a</kbd> accept <kbd>x</kbd> reject &nbsp;<kbd>n</kbd> next</span>
</div>
<div id=list></div>
<script>
const FPS = 1000 / 33;               // the 360p rips
let rows = [], edits = {}, open = null, saveTimer = null;

function parseCSV(t) {
  const out = [], n = t.length; let row = [], f = '', q = false, i = 0;
  while (i < n) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; }
    else f += c;
    i++;
  }
  if (f.length || row.length) { row.push(f); out.push(row); }
  const h = out.shift();
  return out.filter(r => r.length === h.length).map(r => Object.fromEntries(h.map((k, j) => [k, r[j]])));
}
const sec = h => { const p = h.split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : +h; };
const hms = s => { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = (s % 60).toFixed(2).padStart(5, '0'); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${x}`; };
const E = id => edits[id] || (edits[id] = {});
const cur = (r, k) => (edits[r.id] && edits[r.id][k]) || r[k];

async function load() {
  rows = parseCSV(await (await fetch('/work/segments.csv')).text());
  try { edits = await (await fetch('/work/review.json')).json(); } catch (e) { edits = {}; }
  for (const id in edits) {                       // migrate old single video_from into holds
    const e = edits[id]; if (e.video_from && !e.holds && e.start) e.holds = e.start + '-' + e.video_from; delete e.video_from;
  }
  for (const r of rows) {                         // prefill cutaways flag from screen_spans gaps
    if (edits[r.id] && 'cutaways' in edits[r.id]) continue;
    const gaps = (r.screen_spans || '').split(';').filter(Boolean).length - 1;
    if (gaps > 0) E(r.id).cutaways = true;
  }
  render();
}

function render() {
  const q = document.getElementById('q').value.toLowerCase(), fm = document.getElementById('fm').value, fs = document.getElementById('fs').value;
  const L = document.getElementById('list'); L.innerHTML = '';
  let k = 0;
  for (const r of rows) {
    const st = (edits[r.id] || {}).status || 'todo';
    if (fm && r.method.split('+')[0] !== fm) continue;
    if (fs === 'auto' ? !(edits[r.id] || {}).auto_cuts : (fs && st !== fs)) continue;
    if (q && !(r.id + ' ' + r.anchor_text + ' ' + r.category).toLowerCase().includes(q)) continue;
    k++;
    const d = document.createElement('div'); d.className = 'c ' + st; d.id = 'row-' + r.id;
    const labs = ['pre', 'start', 'mid', 'end', 'post'];
    d.innerHTML = `<div><b>${r.id}</b> <span class=lab>${r.category}</span><br>
      <span class="m ${r.method.split('+')[0]}">${r.method}</span> conf ${r.confidence}<br>
      <span class=big>${cur(r, 'start')} → ${cur(r, 'end')}</span> <span class=lab>(${(sec(cur(r, 'end')) - sec(cur(r, 'start'))).toFixed(1)} s) anchor ${r.anchor}</span><br>
      <span class=lab>${esc(r.anchor_text.slice(0, 160))}</span><br>
      <span class=lab>${r.screen_spans ? 'on screen: ' + r.screen_spans.split(';').length + ' span(s)' : ''} ${(edits[r.id] || {}).cutaways ? '· <b style="color:#fc6">cutaways</b>' : ''} ${(edits[r.id] || {}).auto_cuts ? '· <b style="color:#6cf">auto-cut' + (edits[r.id].auto_frac != null ? ' ' + Math.round(edits[r.id].auto_frac * 100) + '% bezel' : '') + ', to check</b>' : ''} ${(edits[r.id] || {}).holds ? '· <b style="color:#fc6">holds</b> ' + esc(edits[r.id].holds) : ''} ${(edits[r.id] || {}).cuts ? '· <b style="color:#f66">cuts</b> ' + esc(edits[r.id].cuts) : ''} ${(edits[r.id] || {}).note ? '· ' + esc(edits[r.id].note) : ''}</span><br>
      <button onclick="toggle('${r.id}')">▶ watch / edit</button>
      <button onclick="setStatus('${r.id}','accept')">✓</button> <button onclick="setStatus('${r.id}','reject')">✗</button></div>` +
      labs.map(l => `<div><img class=t src="/work/seg/${r.episode}/${r.id}_${l}.jpg" onclick="toggle('${r.id}','${l}')"><div class=lab>${l}</div></div>`).join('') +
      `<div class=strip><img src="/work/seg/${r.episode}/${r.id}_strip.png"></div><div class=panel></div>`;
    L.appendChild(d);
  }
  document.getElementById('count').textContent = k + ' / ' + rows.length + ' rows';
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function toggle(id, at) {
  const r = rows.find(x => x.id === id), d = document.getElementById('row-' + id);
  if (open && open.id !== id) closePanel();
  if (open && open.id === id && !at) { closePanel(); return; }
  if (!open) {
    d.classList.add('open');
    const p = d.querySelector('.panel');
    p.innerHTML = `<div><div class=vwrap><video preload="metadata" src="/video/${r.episode}"></video><canvas class=hold id=hc width=480 height=360></canvas></div>
      <div class=big id=tc>--:--:--.--</div></div>
      <div class=ctl>
        <div class=row>start <input type=text id=es value="${cur(r, 'start')}"> <button onclick="go(sec(es.value))">go</button> <button onclick="setHere('start')">[ set start = here</button>
          &nbsp; end <input type=text id=ee value="${cur(r, 'end')}"> <button onclick="go(sec(ee.value))">go</button> <button onclick="setHere('end')">] set end = here</button></div>
        <div class=row>holds <input class=holds type=text id=eh value="${esc((edits[id] || {}).holds || '')}" placeholder="a-b; a-b  (picture frozen on the frame at b, audio continues)" onchange="onEdit()">
          <button onclick="holdMark()">{ hold start = here</button> <button onclick="holdEnd()">} hold end = here</button> <button onclick="holdFromStart()">v hold start→here</button>
          <button onclick="holdsFromGaps()">prefill from screen gaps</button> <button onclick="eh.value='';onEdit()">clear</button>
          <span class=lab>picture frozen on the frame at b, audio continues</span></div>
        <div class=row>cuts &nbsp; <input class=holds type=text id=ecx value="${esc((edits[id] || {}).cuts || '')}" placeholder="a-b; a-b  (video AND audio removed; the show joins up)" onchange="onEdit()">
          <button onclick="cutMark()">( cut start = here</button> <button onclick="cutEnd()">) cut end = here</button> <button onclick="ecx.value='';onEdit()">clear</button>
          <span class=lab>both preview with ▶ play segment</span>
          &nbsp; <button onclick="keepCuts()" title="k">✓ keep cuts (k)</button> <button onclick="undoCuts()" title="u">undo all cuts → whole clip (u)</button>${(edits[id] || {}).prev_holds != null ? ' <button onclick="revertCuts()" title="r">revert to my edit (r)</button>' : ''}</div>
        <div class=row><button onclick="step(-5)">−5 s</button><button onclick="step(-1)">−1 s</button><button onclick="step(-1/FPS)">−1 f</button>
          <button id=pp onclick="playPause()">play</button>
          <button onclick="step(1/FPS)">+1 f</button><button onclick="step(1)">+1 s</button><button onclick="step(5)">+5 s</button>
          &nbsp; <button onclick="playSeg()">▶ play segment</button> <button onclick="go(sec(es.value)-3)">3 s before start</button> <button onclick="go(sec(ee.value)-3)">3 s before end</button></div>
        <div class=row>category <input type=text id=ec value="${cur(r, 'category')}" onchange="onEdit()">
          <label><input type=checkbox id=ecut ${(edits[id] || {}).cutaways ? 'checked' : ''} onchange="onEdit()"> cutaways to the sofa while TV audio continues</label></div>
        <div class=row><input class=note type=text id=en placeholder="note" value="${esc((edits[id] || {}).note || '')}" onchange="onEdit()"></div>
        <div class=row><button onclick="setStatus('${id}','accept')">✓ accept (a)</button> <button onclick="setStatus('${id}','reject')">✗ reject (x)</button> <button onclick="nextRow()">next (n)</button></div>
      </div>`;
    const v = p.querySelector('video');
    v.addEventListener('timeupdate', tick); v.addEventListener('seeked', tick);
    v.addEventListener('loadedmetadata', () => go(at === 'end' || at === 'post' ? sec(ee.value) - 1 : sec(es.value) - 1));
    open = { id, r, v, d };
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (at) {
    go(at === 'end' || at === 'post' ? sec(ee.value) - 1 : sec(es.value) - 1);
  }
}
function closePanel() { if (!open) return; open.v.pause(); open.v.removeAttribute('src'); open.v.load(); open.d.classList.remove('open'); open.d.querySelector('.panel').innerHTML = ''; open = null; }
function tick() { if (open) tc.textContent = hms(open.v.currentTime) + '  (' + Math.round(open.v.currentTime * FPS) + ' f)'; }
function go(t) { if (open) { holdRun++; hc.style.display = 'none'; open.v.pause(); open.v.currentTime = Math.max(0, t); pp.textContent = 'play'; } }
function step(dt) { if (open) go(open.v.currentTime + dt); }
function playPause() { if (!open) return; if (open.v.paused) { open.v.play(); pp.textContent = 'pause'; } else { open.v.pause(); pp.textContent = 'play'; } }
const rangesOf = el => el.value.split(';').map(x => x.trim()).filter(Boolean).map(x => x.split('-').map(sec)).filter(h => h.length === 2 && h[1] > h[0]).sort((a, b) => a[0] - b[0]);
const holdsOf = () => rangesOf(eh), cutsOf = () => rangesOf(ecx);
function seekTo(v, t) { return new Promise(res => { const f = () => { v.removeEventListener('seeked', f); res(); }; v.addEventListener('seeked', f); v.currentTime = t; }); }
let holdRun = 0;
async function playSeg() {
  if (!open) return; const v = open.v, e = sec(ee.value), holds = holdsOf(), cuts = cutsOf(), run = ++holdRun;
  const frames = [];                                        // capture the frame at each hold end
  for (const h of holds) { v.pause(); await seekTo(v, h[1]); const c = document.createElement('canvas'); c.width = 480; c.height = 360; c.getContext('2d').drawImage(v, 0, 0, 480, 360); frames.push(c); }
  if (run !== holdRun) return;
  go(sec(es.value)); const run2 = ++holdRun; pp.textContent = 'pause';
  try { await v.play(); } catch (err) { return; }
  const loop = () => {
    if (!open || open.v !== v || run2 !== holdRun) { hc.style.display = 'none'; return; }
    // Cuts: the browser paints the first cut frame before this loop can see it, and the seek takes a
    // few more frames, so jump one frame early and keep the last good frame on the canvas while seeking.
    // (extract_clips is frame-exact; this only makes the preview match it.)
    const t = v.currentTime, c = cuts.find(x => t >= x[0] - 1.5 / FPS && t < x[1]);
    if (c) {
      if (!v.seeking) { hc.getContext('2d').drawImage(v, 0, 0, 480, 360); hc.style.display = 'block'; v.currentTime = c[1] + 0.05; }  // land just past b: seeks snap to the frame before
      requestAnimationFrame(loop); return;
    }
    const i = holds.findIndex(h => t >= h[0] && t < h[1]);
    if (i >= 0) { hc.getContext('2d').drawImage(frames[i], 0, 0); hc.style.display = 'block'; } else if (!v.seeking) hc.style.display = 'none';
    if (t >= e - 1 / FPS || v.paused) { v.pause(); pp.textContent = 'play'; hc.style.display = 'none'; return; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
let holdA = null;
function addRange(el, a, b) { if (b <= a) return; const hs = rangesOf(el).filter(h => h[1] <= a || h[0] >= b); hs.push([a, b]); hs.sort((x, y) => x[0] - y[0]); el.value = hs.map(h => hms(h[0]) + '-' + hms(h[1])).join('; '); onEdit(); }
const addHold = (a, b) => addRange(eh, a, b);
let cutA = null;
function cutMark() { if (!open) return; cutA = open.v.currentTime; document.getElementById('status').textContent = 'cut start ' + hms(cutA) + ' — press ) at the cut end'; }
function cutEnd() { if (!open || cutA === null) return; addRange(ecx, cutA, open.v.currentTime); cutA = null; }
function holdMark() { if (!open) return; holdA = open.v.currentTime; document.getElementById('status').textContent = 'hold start ' + hms(holdA) + ' — press } at the hold end'; }
function holdEnd() { if (!open || holdA === null) return; addHold(holdA, open.v.currentTime); holdA = null; }
function holdFromStart() { if (!open) return; addHold(sec(es.value), open.v.currentTime); }
function holdsFromGaps() { if (!open) return; const sp = (open.r.screen_spans || '').split(';').filter(Boolean).map(x => x.split('-').map(sec));
  for (let i = 0; i + 1 < sp.length; i++) addHold(sp[i][1], sp[i + 1][0]); }
// auto_cuts.py marks rows auto_cuts=true; "keep" clears the flag, "undo" also drops every hold and cut
function keepCuts() { if (!open) return; delete E(open.id).auto_cuts; onEdit(); nextRow(); }
function undoCuts() { if (!open) return; eh.value = ''; ecx.value = ''; delete E(open.id).auto_cuts; onEdit(); nextRow(); }
function revertCuts() { if (!open) return; const e = E(open.id); if (e.prev_holds == null) return; eh.value = e.prev_holds; ecx.value = e.prev_cuts || ''; delete e.prev_holds; delete e.prev_cuts; delete e.auto_cuts; onEdit(); nextRow(); }
function setHere(which) { if (!open) return; const t = hms(open.v.currentTime); ({start: es, end: ee})[which].value = t; onEdit(); }
function onEdit() {
  if (!open) return; const e = E(open.id);
  e.start = es.value; e.end = ee.value; e.category = ec.value; e.cutaways = ecut.checked; e.note = en.value; e.holds = eh.value.trim(); e.cuts = ecx.value.trim();
  refreshRow(open.id); save(open.id);
}
function setStatus(id, s) { E(id).status = s; if (open && open.id === id) onEdit(); else { refreshRow(id); save(id); } }
function refreshRow(id) {
  const d = document.getElementById('row-' + id); if (!d) return;
  const r = rows.find(x => x.id === id), st = (edits[id] || {}).status || 'todo';
  d.className = 'c ' + st + (open && open.id === id ? ' open' : '');
  d.querySelector('.big').textContent = cur(r, 'start') + ' → ' + cur(r, 'end');
}
function nextRow() { if (!open) return; const ds = [...document.querySelectorAll('.c')], i = ds.indexOf(open.d); if (!ds[i + 1]) return; closePanel(); toggle(ds[i + 1].id.slice(4)); }
const dirty = new Set();
function save(id) {                       // only rows edited in this tab are posted; the server merges per row
  if (id) dirty.add(id);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = {}; for (const k of dirty) body[k] = edits[k]; dirty.clear();
    const r = await fetch('/save', { method: 'POST', body: JSON.stringify(body) });
    const j = await r.json(); document.getElementById('status').textContent = 'saved · ' + j.accepted + ' accepted → work/segments_reviewed.csv';
  }, 400);
}
document.addEventListener('keydown', ev => {
  if (!open || ev.target.tagName === 'INPUT') return;
  const m = { ',': -1 / FPS, '.': 1 / FPS, 'ArrowLeft': ev.shiftKey ? -5 : -1, 'ArrowRight': ev.shiftKey ? 5 : 1 };
  if (ev.key in m) { step(m[ev.key]); ev.preventDefault(); }
  else if (ev.key === ' ') { playPause(); ev.preventDefault(); }
  else if (ev.key === '[') setHere('start'); else if (ev.key === ']') setHere('end'); else if (ev.key === '{') holdMark(); else if (ev.key === '}') holdEnd(); else if (ev.key === 'v') holdFromStart(); else if (ev.key === '(') cutMark(); else if (ev.key === ')') cutEnd();
  else if (ev.key === 'a') setStatus(open.id, 'accept'); else if (ev.key === 'x') setStatus(open.id, 'reject');
  else if (ev.key === 'n') nextRow(); else if (ev.key === 'k') keepCuts(); else if (ev.key === 'u') undoCuts(); else if (ev.key === 'r') revertCuts();
});
for (const id of ['q', 'fm', 'fs']) document.getElementById(id).addEventListener('input', () => { closePanel(); render(); });
load();
</script>

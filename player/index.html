<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip TV</title>
<style>
  :root{
    --walnut:#5a3a22; --walnut-dark:#3b2414; --cream:#e9dcb8; --phosphor:#0b0f0c;
    --brass:#c9a44c; --mustard:#d9a32b; --ink:#1a120c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2e2a2a,#151212 70%);
    font-family:"Courier New",Courier,monospace;color:var(--cream);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:16px}

  .tv{position:relative;width:min(94vw,720px);aspect-ratio:4/3;
    background:linear-gradient(160deg,#6b4629,var(--walnut) 40%,var(--walnut-dark));
    border:6px solid var(--ink);border-radius:28px 28px 22px 22px;
    box-shadow:0 30px 60px #000a,inset 0 4px 0 #8a5c36,inset 0 -6px 0 #24150a;
    display:grid;grid-template-columns:1fr 22%;gap:0;padding:5%}
  /* antenna */
  .tv::before,.tv::after{content:"";position:absolute;top:-38%;width:6px;height:40%;
    background:linear-gradient(#ddd,#666);border:3px solid var(--ink);border-radius:4px;
    transform-origin:bottom center}
  .tv::before{left:42%;transform:rotate(-28deg)}
  .tv::after{left:52%;transform:rotate(24deg)}

  .bezel{position:relative;background:var(--cream);border:5px solid var(--ink);border-radius:18px;
    padding:6%;box-shadow:inset 0 0 0 6px #d3c39b}
  .screen{position:relative;width:100%;height:100%;background:var(--phosphor);
    border:4px solid var(--ink);border-radius:40px/32px;overflow:hidden;
    box-shadow:inset 0 0 60px #000}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px),
      radial-gradient(ellipse at center,#fff0 55%,#0009 100%)}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas.noise{position:absolute;inset:0;width:100%;height:100%;display:none}
  .osd{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;
    font-weight:bold;font-size:clamp(11px,2.2vw,16px);color:#7cff6b;text-shadow:0 0 6px #7cff6b99;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
  .osd.show{opacity:1}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:#7cff6b;text-align:center;padding:8%;font-size:clamp(11px,2.3vw,15px);cursor:pointer}
  .empty b{font-size:1.5em;letter-spacing:.15em}
  .empty small{opacity:.7}

  .panel{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 0 0 6%}
  .dial{width:70%;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);
    background:radial-gradient(circle at 35% 35%,#f0d27a,var(--brass) 55%,#8a6a25);
    position:relative;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.6,1);
    box-shadow:0 4px 0 var(--ink)}
  .dial::after{content:"";position:absolute;left:50%;top:6%;width:10%;height:38%;
    background:var(--ink);border-radius:3px;transform:translateX(-50%)}
  .label{font-size:clamp(8px,1.4vw,11px);letter-spacing:.2em;color:var(--cream);opacity:.8;margin-top:6px}
  .row{display:flex;gap:10%;width:100%;justify-content:center}
  .btn{width:34%;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);background:var(--mustard);
    box-shadow:0 4px 0 var(--ink);cursor:pointer;font:bold clamp(9px,1.6vw,13px) inherit;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:0}
  .btn:active,.dial:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.on{background:#ff6b3d}
  .btn:focus-visible,.dial:focus-visible{outline:3px solid #7cff6b;outline-offset:3px}
  .speaker{width:80%;height:16%;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,#0000 3px 8px);
    border-radius:4px;opacity:.7}
  input[type=file]{display:none}
  @media (prefers-reduced-motion:reduce){.dial{transition:none}}
</style>
</head>
<body>
<div class="tv">
  <div class="bezel">
    <div class="screen" id="screen">
      <div class="osd" id="osd"><span id="osdCh">CH --</span><span id="osdName"></span></div>
      <video id="video" playsinline></video>
      <canvas class="noise" id="noise"></canvas>
      <div class="empty" id="empty">
        <b>NO SIGNAL</b>
        <span>Tap here to load clips</span>
        <small>or drop video files onto the screen</small>
      </div>
    </div>
  </div>
  <div class="panel">
    <div>
      <div class="dial" id="dial" tabindex="0" role="button" aria-label="Next channel"></div>
      <div class="label">CHANNEL</div>
    </div>
    <div class="row">
      <button class="btn" id="prev" aria-label="Previous">◀</button>
      <button class="btn" id="next" aria-label="Next">▶</button>
    </div>
    <div>
      <button class="btn" id="shuffle" style="width:60%;aspect-ratio:auto;border-radius:12px;padding:6px 4px">SHUFFLE</button>
    </div>
    <div class="speaker"></div>
  </div>
</div>
<input type="file" id="picker" accept="video/*" multiple>

<script>
const video=document.getElementById('video'), noise=document.getElementById('noise'),
      osd=document.getElementById('osd'), osdCh=document.getElementById('osdCh'),
      osdName=document.getElementById('osdName'), empty=document.getElementById('empty'),
      picker=document.getElementById('picker'), dial=document.getElementById('dial'),
      shuffleBtn=document.getElementById('shuffle'), screen=document.getElementById('screen');

let clips=[], order=[], pos=-1, shuffle=false, dialAngle=0, osdTimer=null;

function load(files){
  clips.forEach(c=>URL.revokeObjectURL(c.url));
  clips=[...files].filter(f=>f.type.startsWith('video/'))
    .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))
    .map(f=>({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
  if(!clips.length) return;
  empty.style.display='none';
  buildOrder(); pos=-1; step(1);
}
function buildOrder(){
  order=clips.map((_,i)=>i);
  if(shuffle) for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]];}
}
function step(dir){
  if(!clips.length) return;
  pos=(pos+dir+order.length)%order.length;
  dialAngle+=dir*30; dial.style.transform=`rotate(${dialAngle}deg)`;
  flashStatic(()=>{
    const c=clips[order[pos]];
    video.src=c.url; video.play().catch(()=>{});
    osdCh.textContent=`CH ${String(order[pos]+1).padStart(2,'0')}/${clips.length}`;
    osdName.textContent=c.name.slice(0,28);
    osd.classList.add('show'); clearTimeout(osdTimer);
    osdTimer=setTimeout(()=>osd.classList.remove('show'),2500);
  });
}
function flashStatic(done){
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduced) return done();
  const ctx=noise.getContext('2d'); noise.width=160; noise.height=120; noise.style.display='block';
  let frames=0;
  (function draw(){
    const img=ctx.createImageData(160,120), d=img.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
    ctx.putImageData(img,0,0);
    if(++frames<8) requestAnimationFrame(draw); else {noise.style.display='none'; done();}
  })();
}

video.addEventListener('ended',()=>step(1));
document.getElementById('next').onclick=()=>step(1);
document.getElementById('prev').onclick=()=>step(-1);
dial.onclick=()=>step(1);
dial.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step(1);}};
shuffleBtn.onclick=()=>{
  shuffle=!shuffle; shuffleBtn.classList.toggle('on',shuffle);
  const cur=order[pos]; buildOrder(); pos=order.indexOf(cur);
};
empty.onclick=()=>picker.click();
picker.onchange=e=>load(e.target.files);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') step(1);
  else if(e.key==='ArrowLeft') step(-1);
  else if(e.key===' '&&clips.length){e.preventDefault(); video.paused?video.play():video.pause();}
});
// swipe
let sx=null;
screen.addEventListener('pointerdown',e=>sx=e.clientX);
screen.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>40) step(dx<0?1:-1);
});
// drag & drop
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault(); load(e.dataTransfer.files);});
</script>
</body>
</html>
